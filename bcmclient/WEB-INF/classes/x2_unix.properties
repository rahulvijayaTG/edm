#Fri Oct 05 10:01:09 CDT 2001
LOG.PRIORITY=WARN
workflow-id=system\:ProcessRequest
model-attribute.compile-trace=off
model-attribute.validate-classes=on
model-attribute.validate-stop-on-error=off
model-attribute.modelpath=/WEB-INF/bcm/model:/WEB-INF/core/model:/WEB-INF/system:/WEB-INF/upload_kit/model
#model-class=com.i2.x2.model.xmlfile.XmlFileModel
model-class=com.i2.x2.model.sax.XmlFileModel
model-attribute.load-trace=off
model-attribute.valid-extensions=xml;def;x2;cfg;cmp;cnd;wfl;pgl
CONTEXT.MODELPATH=/WEB-INF/system/context/xml/resolvers.xml
#LOGGER_CLASS=com.i2.x2.auditlogging.StdOutLogger
LOGGER_CLASS=com.i2.x2.util.logger.DynamicLogger
LOGGER_CONFIG_PATH=/WEB-INF/system/LoggerSettings.xml
LOGGER_DYNAMIC_CONFIG=on
model.sax.loader.workflow.activity=com.i2.x2.util.workflow.WorkflowLoadHandler
#model.sax.loader.metadata.page=com.i2.x2.util.configurability.PageMetaDataLoadHandler
model.sax.loader.ui.page-group=com.i2.ui.pgl.x2.util.PageMetaDataLoadHandler
org.xml.sax.driver=org.apache.xerces.parsers.SAXParser
javax.xml.parsers.SAXParserFactory=org.apache.xerces.jaxp.SAXParserFactoryImpl
#Sets the CommandRequest to use Poster instead of in process x-core.
com.i2.x2.util.xcore.UsePoster=true
#Set SSOLoginModule to CIS Login Module defined in cis-auth.config file
SSOLoginModule=OMxLoginModule
com.i2.ui.pgl.version=2
#Set in-process (co-located) xcore services (multiple can be comma-separated)
xcore.xservices=xserver.xml,ui_workflow.xml
