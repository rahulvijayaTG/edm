<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE x2:config-context SYSTEM
  "../dtd/config-context.dtd">

<x2:config-context
  description="Root Configuration Context"
  name="ROOT"
  xmlns:x2="http://www.i2.com/x2">

  <x2:attribute name="CommandNotFoundPage" 
                value="/system/notfound.jsp" 
                description="system default command not found page" 
                final="no"/>

  <x2:attribute name="ErrorPage" 
                value="/system/error.jsp" 
                description="system default error page" 
                final="no"/>

  <x2:attribute name="ReloadPage" 
                value="/system/reload.jsp" 
                description="system reload page for development purposes only" 
                final="no"/>

  <x2:attribute name="UseAccessControl" 
                value="no" 
                description="'no' indicates to disable access control; 'yes' indicates to enable access control" 
                final="no"/>

  <x2:attribute name="UserProfileStylesheet" 
                value="/demo/profile.xsl" 
                description="Default XSL stylesheet for user profile data" 
                final="no"/>

  <x2:attribute name="OrderServer" 
                value="OMS" 
                description="Identifies OMS as the order server" 
                final="no"/>

  <x2:attribute name="HomePage" 
                value="/demo/home.jsp" 
                description="default home page" 
                final="no"/>

  <x2:attribute name="LoginPage" 
                value="/demo/login.jsp" 
                description="default login page" 
                final="no"/>

  <x2:attribute name="ProductsPage" 
                value="/demo/products.jsp" 
                description="default product list page" 
                final="no"/>

  <x2:attribute name="ConfirmationPage" 
                value="/demo/confirm.jsp" 
                description="default order confirmation page" 
                final="no"/>

  <x2:attribute name="OrderErrorPage" 
                value="/demo/error.jsp" 
                description="default order error page" 
                final="no"/>

  <x2:attribute name="AccessDeniedPage" 
                value="/demo/locked.html" 
                description="default access denied page" 
                final="no"/>

  <x2:attribute name="ProfilePage" 
                value="/demo/profile.jsp" 
                description="default user profile page" 
                final="no"/>

  <x2:attribute name="StartPage" 
                value="/x2/index.html" 
                description="default start page" 
                final="no"/>

  <x2:attribute name="ReEntryUrl" 
                value="/x2/democontroller/demo.workflow:Enter" 
                description="Url that is used upon login to reenter the demo" 
                final="no"/>
  
  <x2:attribute name="Attribute1" value="One" description="One" final="no"/>
  <x2:attribute name="Attribute2" value="Two" description="Two" final="no"/>
  <x2:attribute name="Attribute3" value="Three" description="Three" final="no"/>
</x2:config-context>
