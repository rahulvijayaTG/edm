<?xml version="1.0" encoding="UTF-8"?>

<x2:config description="Permissibility expression functions"
        xmlns:x2="http://www.i2.com/x2"
        xmlns:system="http://www.i2.com/system"
>
  <!-- usage: identity-property( name ) -->
  <x2:function name="identity-property" classname="com.i2.x2.expression.functions.identity.GetPropertyValue"/>  

  <!-- usage: identity-roles() -->
  <x2:function name="identity-roles" classname="com.i2.x2.expression.functions.identity.GetRoles"/>  

  <!-- usage: identity-user-id() -->
  <x2:function name="identity-user-id" classname="com.i2.x2.expression.functions.identity.GetUserId"/>  

  <!-- usage: identity-username() -->
  <x2:function name="identity-username" classname="com.i2.x2.expression.functions.identity.GetUserName"/>  

  <!-- usage: identity-user-org() -->
  <x2:function name="identity-user-org" classname="com.i2.x2.expression.functions.identity.GetUserOrg"/>  
</x2:config>
