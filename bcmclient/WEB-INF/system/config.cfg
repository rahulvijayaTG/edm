<?xml version="1.0" encoding="UTF-8"?>

<x2:config description="Core configuration data"
        xmlns:x2="http://www.i2.com/x2"
        xmlns:system="http://www.i2.com/system"
>
  <x2:exception-handler
      exception-class="java.lang.Throwable"
      command="system:HandleException"
      description="handles exceptions when all else fails"
  />
  <x2:exception-handler
      exception-class="com.i2.x2.engine.CommandNotFoundException"
      command="system:HandleCommandNotFound"
      description="if a command is not found in the engine's model"
  />

  <x2:exception-handler
      exception-class="com.i2.x2.util.xcore.LocatorNotFoundException"
      command="system:GoToLocatorNotFound"
      description="if locator is not found"
  />
  <x2:exception-handler
      exception-class="com.i2.x2.util.xcore.ServicesNotRegisteredException"
      command="system:GoToServicesNotRegistered"
      description="if the services are not registered."
  />

  <!-- component TYPES -->
  <x2:component-type 
      name="System" 
      description="reserved for x2 system components (e.g., x2:command, x2:execute)"
  />
  
  <x2:component-type 
      name="Error" 
      description="components that have onError method implementations, no execute method implementations and are used as error handlers"
  />
  
  <x2:component-type 
      name="Page" 
      description="components that perform some form of page operation.  For example, forward to page, redirect to page, include page"
  />



  <!-- DEPRECATED -->
  <x2:component-type name="TopLevel" description="_"/>
  <x2:component-type name="BodyComponent" description="_"/>
  
  <x2:component-type name="Expression" description="_">
    <x2:extends name="BodyComponent"/>
  </x2:component-type>
  
  <x2:component-type name="OutputExpression" description="_">    
    <x2:extends name="Expression"/>
  </x2:component-type>  
  
  <x2:component-type name="TopLevelExpression" description="_">
    <x2:extends name="TopLevel"/>
	  <x2:extends name="Expression"/>
  </x2:component-type>
  <!-- DEPRECATED -->

</x2:config>
